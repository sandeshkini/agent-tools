name: agent-tools
# Shared agent services, extracted from agent-hub on 2026-08-11 so agent-hub can be fully retired.
#   • artifacts  — the publish board          → artifacts.kingdomofluna.com (write: push.artifacts.kingdomofluna.com)
#   • ntfy       — the phone push bus          → ntfy.kingdomofluna.com  (host :8095)
#   • mcp-tools  — shared MCP: publish_artifact + notify (cptr consumes it at 127.0.0.1:8009/mcp)
# `apps` network name is legacy (from when Traefik fronted everything on apps.kingdomofluna.com,
# now retired) but still the real external Docker network these services share — don't rename it,
# nothing here needs a matching hostname anymore, it's just the network identifier.
# Data dirs (artifacts/content, ntfy/data) are gitignored.

services:
  artifacts:
    build: ./artifacts
    image: agent-tools/artifacts
    container_name: artifacts
    restart: unless-stopped
    environment:
      BASE_PATH: "${ARTIFACTS_BASE_PATH:-}"                      # served at domain root now
      PUBLIC_BASE: "${ARTIFACTS_PUBLIC_BASE:-https://artifacts.kingdomofluna.com}"
      PUBLISH_TOKEN: "${PUBLISH_TOKEN}"                          # gates POST /api/publish
      NTFY_URL: "${NTFY_URL:-http://ntfy:80}"                    # container→container
      NTFY_TOPIC: "${NTFY_TOPIC}"
      NTFY_TOKEN: "${NTFY_TOKEN}"
      PUSH_ONLY_HOST: "${ARTIFACTS_PUSH_HOST:-push.artifacts.kingdomofluna.com}"
    ports:
      - "127.0.0.1:8083:8080"   # direct -- traefik removed 2026-08-15, was its last real consumer
    volumes:
      - ${ARTIFACTS_CONTENT:-./artifacts/content}:/content
    networks: [default, apps]

  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: "${NTFY_PUBLIC_URL:-https://ntfy.kingdomofluna.com}"
      NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"                  # iOS instant push relay
      NTFY_BEHIND_PROXY: "true"
      NTFY_AUTH_FILE: "/var/lib/ntfy/user.db"
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"                      # fail-closed
      NTFY_CACHE_FILE: "/var/cache/ntfy/cache.db"
      NTFY_ATTACHMENT_CACHE_DIR: "/var/cache/ntfy/attachments"
      TZ: "${TZ:-America/Toronto}"
    ports:
      - "${NTFY_PORT:-8095}:80"
    volumes:
      - ${NTFY_DATA:-./ntfy/data}/lib:/var/lib/ntfy
      - ${NTFY_DATA:-./ntfy/data}/cache:/var/cache/ntfy
    networks: [default, apps]   # Traefik labels removed 2026-08-16 — dead weight, Pangolin has targeted localhost:8095 directly since Traefik was removed 2026-08-15

  mcp-tools:
    build: ./mcp-tools
    image: agent-tools/mcp-tools
    container_name: mcp-tools
    restart: unless-stopped
    ports:
      - "127.0.0.1:8009:8000"                                   # cptr consumes this MCP endpoint
    environment:
      PORT: "8000"
      ARTIFACTS_API: "${ARTIFACTS_API:-http://artifacts:8080/api/publish}"
      PUBLIC_BASE: "${ARTIFACTS_PUBLIC_BASE:-https://artifacts.kingdomofluna.com}"   # apps.kingdomofluna.com is retired (orphaned 2026-08-15) — don't revert this
      PUBLISH_TOKEN: "${PUBLISH_TOKEN}"
      SOURCE_LABEL: "${MCP_SOURCE_LABEL:-cptr}"                   # stamped on every artifact this server publishes/creates
      COMPUTER_LABEL: "${COMPUTER_LABEL:-unknown}"                # which machine this deployment runs on — set per-machine in .env
      NTFY_URL: "${NTFY_URL:-http://ntfy}"
      NTFY_TOPIC: "${NTFY_TOPIC}"
      NTFY_TOKEN: "${NTFY_TOKEN}"
    volumes:
      # Read-only so publish_files (added 2026-08-16) can actually open a local_path an agent
      # gives it -- containerized, so it can't see the host filesystem otherwise. Deliberately
      # scoped to /tmp only, not a broader mount (e.g. the home dir): this container is reachable
      # by every agent that talks MCP here, so keep its filesystem blast radius to "whatever an
      # agent already staged for publishing" rather than "everything on the box". Stage a file
      # there first (cp foo.pdf /tmp/) if it lives elsewhere. Host installs (aibo-mac/aibo-dev/
      # sage-agent, install.sh, no Docker) don't need this -- they already run as a normal
      # process with full local filesystem access.
      - /tmp:/tmp:ro
    networks: [default, apps]

networks:
  default:
  apps:
    external: true
