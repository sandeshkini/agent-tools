<!doctype html>
<meta charset="utf-8">
<title>cptr desktop encoder</title>
<body style="font:14px system-ui;background:#111;color:#ddd;padding:2rem">
<h3>desktop encoder</h3>
<pre id="log">starting…</pre>
<script>
// Runs in a background Chrome launched with
//   --auto-select-desktop-capture-source='Entire Screen'
// so getDisplayMedia returns the whole monitor with no picker dialog.
const log = m => {
  document.getElementById('log').textContent = m; console.log(m);
  // headless under launchd: nobody can read this page, so ship it to the server.
  // .catch() is load bearing: while the server is down every fetch rejects, and
  // an unhandled rejection fires the handler below, which calls log() again --
  // a feedback loop that pegged the CPU exactly during a server restart.
  try { fetch('/clientlog', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({msg: 'encoder: ' + m})}).catch(() => {}); } catch (_) {}
};
window.addEventListener('error', e => log('window.error ' + e.message));
window.addEventListener('unhandledrejection', e => log('unhandled ' + e.reason));

const params = new URLSearchParams(location.search);
const MAX_HEIGHT = +(params.get('height') || 1080);
const FPS = +(params.get('fps') || 30);
const BITRATE = +(params.get('bitrate') || 8_000_000);

let socket, encoder, forceKey = true;
let announcement = null;     // survives reconnects; the old code bound the codec
                             // announcement to the FIRST socket object only, so a
                             // reconnected encoder never re-announced its codec
let reconnectTimer = null;
let lastReload = 0;

// The page is parked offscreen, so a failure here is invisible: nothing recovers
// it except a human noticing a frozen stream. Reload rather than sit there dead.
function bail(why) {
  log('BAIL ' + why + ' -- reloading encoder page');
  if (Date.now() - lastReload < 10000) return;   // never hot-loop on reloads
  lastReload = Date.now();
  setTimeout(() => location.reload(), 1000);
}

function connect() {
  // Guard: frame-driven and timer-driven health checks both call this, and
  // stacking sockets would have the server see phantom encoder connections.
  if (socket && (socket.readyState === 0 || socket.readyState === 1)) return;
  clearTimeout(reconnectTimer); reconnectTimer = null;

  socket = new WebSocket(`ws://${location.host}/ws/encoder`);
  socket.binaryType = 'arraybuffer';
  socket.onopen = () => {
    log('socket open — capturing');
    // The server drops its cached keyframe when an encoder disconnects, so a
    // fresh connection must re-announce the codec AND lead with a keyframe or
    // every viewer stares at a black canvas.
    if (announcement) socket.send(announcement);
    forceKey = true;
  };
  socket.onmessage = e => {
    // viewer joined: next frame must be a keyframe or it cannot decode
    if (String(e.data) === 'keyframe') forceKey = true;
  };
  socket.onerror = () => log('socket error');
  socket.onclose = ev => {
    log('socket closed code=' + ev.code + ' reason=' + (ev.reason || '(none)') +
        ' clean=' + ev.wasClean + ' — reconnecting');
    reconnectTimer = setTimeout(connect, 1000);
  };
}

// Belt and braces. If timers are alive this reconnects a dead socket within a
// second; the frame loop below repeats the check in case they are throttled.
setInterval(() => {
  if (!socket || socket.readyState > 1) connect();
  else if (socket.readyState === 1) socket.send('hb');   // liveness for the server
}, 5000);

async function start() {
  connect();
  const stream = await navigator.mediaDevices.getDisplayMedia({
    audio: false,
    video: {
      displaySurface: 'monitor',
      cursor: 'always',                       // without this you click blind
      height: { ideal: MAX_HEIGHT, max: MAX_HEIGHT },
      frameRate: { ideal: FPS, max: FPS }
    }
  });

  const track = stream.getVideoTracks()[0];
  // A display resolution change or a revoked capture permission ends the track.
  // Nothing else notices, so the stream would just stop forever.
  track.addEventListener('ended', () => bail('capture track ended'));
  const raw = track.getSettings();
  // H.264 needs even dimensions; a resolution like 1671x1080 (odd width, from a
  // non-16:9 display) is rejected by every level. Round down to even.
  const settings = { ...raw,
    width: Math.floor(raw.width / 2) * 2,
    height: Math.floor(raw.height / 2) * 2 };
  log(`capturing ${settings.width}x${settings.height} @${settings.frameRate}fps ` +
      `surface=${settings.displaySurface} cursor=${settings.cursor}`);

  encoder = new VideoEncoder({
    output: (chunk, meta) => {
      if (!socket || socket.readyState !== 1) return;
      // header: [1 byte keyframe flag][4 byte timestamp lo][payload]
      const body = new Uint8Array(chunk.byteLength);
      chunk.copyTo(body);
      const packet = new Uint8Array(body.byteLength + 5);
      packet[0] = chunk.type === 'key' ? 1 : 0;
      new DataView(packet.buffer).setUint32(1, chunk.timestamp >>> 0);
      packet.set(body, 5);
      try { socket.send(packet); } catch (e) { log('send failed: ' + e); }
    },
    // A VideoEncoder error closes the codec for good: every later encode() throws
    // InvalidStateError. Only a fresh pipeline recovers from it.
    error: e => bail('encoder error: ' + e)
  });

  // A codec string encodes a LEVEL, and the level caps resolution. avc1.42E01E
  // is level 3.0 (~720x480) and avc1.42E028 is level 4.0 (8192 macroblocks);
  // an ultrawide 2560x1080 needs 10800, so both fail, the codec closes, and the
  // next encode() throws InvalidStateError. Probe instead of guessing.
  const base = {
    width: settings.width,
    height: settings.height,
    bitrate: BITRATE,
    framerate: FPS,
    latencyMode: 'realtime',
    avc: { format: 'annexb' }                 // self-contained: no extradata needed
  };
  const CANDIDATES = [
    'avc1.640034',  // High   5.2
    'avc1.42E034',  // Baseline 5.2
    'avc1.640033',  // High   5.1
    'avc1.42E033',  // Baseline 5.1
    'avc1.42E028',  // Baseline 4.0 (what cptr uses for a 1080p tab)
  ];

  let chosen = null;
  for (const codec of CANDIDATES) {
    try {
      const support = await VideoEncoder.isConfigSupported({ ...base, codec });
      if (support.supported) { chosen = codec; break; }
    } catch (_) { /* try the next one */ }
  }
  if (!chosen) throw new Error(`no H.264 level supports ${settings.width}x${settings.height}`);

  encoder.configure({ ...base, codec: chosen });
  log(`capturing ${settings.width}x${settings.height} @${settings.frameRate}fps ` +
      `cursor=${settings.cursor} codec=${chosen}`);

  // Viewers must decode with the same codec string, so publish it -- now and on
  // every future reconnect (socket.onopen replays `announcement`).
  announcement = JSON.stringify(
    { codec: chosen, width: settings.width, height: settings.height });
  if (socket?.readyState === 1) socket.send(announcement);

  const processor = new MediaStreamTrackProcessor({ track });
  const reader = processor.readable.getReader();

  while (true) {
    const { value: frame, done } = await reader.read();
    if (done) { bail('capture reader finished'); break; }
    // Reconnect check driven by real frames, not by timers: an occluded tab can
    // have its setTimeout/setInterval throttled to once a minute, but the capture
    // pipeline keeps delivering.
    if (!socket || socket.readyState > 1) connect();
    if (encoder.state !== 'configured') { frame.close(); bail('encoder state=' + encoder.state); break; }
    if (encoder.encodeQueueSize > 2) { frame.close(); continue; }  // drop, never lag
    try {
      encoder.encode(frame, { keyFrame: forceKey });
      forceKey = false;
    } catch (e) {
      frame.close(); bail('encode threw: ' + e); break;
    }
    frame.close();
  }
}

start().catch(e => bail('fatal: ' + e));
</script>
</body>
